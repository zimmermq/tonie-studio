<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tonie-studio{% endblock %}</title>
<style>
  :root {
    --bg: #faf8f5; --card: #fff; --ink: #2a2724; --muted: #7d7669;
    --line: #e4ded4; --accent: #c2410c; --ok: #15803d; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; gap: 16px; align-items: baseline;
  }
  header a.brand { font-weight: 700; color: var(--accent); text-decoration: none; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 14px;
  }
  a { color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, .button {
    font: inherit; padding: 8px 16px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 2px 8px; font-size: 13px; line-height: 1.4; }
  input[type=text] {
    font: inherit; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 7px; width: 100%; background: #fff; color: var(--ink);
  }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  ol.tracks { list-style: none; margin: 0; padding: 0; }
  ol.tracks li {
    display: flex; gap: 10px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  ol.tracks li:last-child { border-bottom: 0; }
  .warn {
    background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px;
  }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .state-done { color: var(--ok); }
  .state-failed { color: var(--bad); }
  img.cover { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; }

  /* The album picker: one dense row per album, cover first. Sixteen cards with
     16px of padding each meant scrolling three screens to see the archive. */
  .searchbar { display: flex; gap: 12px; align-items: center; margin: 20px 0 10px; }
  .searchbar input {
    font: inherit; flex: 1; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .list {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  a.album {
    display: flex; gap: 12px; align-items: center; padding: 8px 12px;
    border-bottom: 1px solid var(--line); color: inherit; text-decoration: none;
  }
  a.album:last-child { border-bottom: 0; }
  a.album:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  a.album img, a.album .noart {
    width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none;
  }
  a.album .noart, .album .noart { background: var(--line); }
  .list .album { display: flex; gap: 12px; align-items: center; padding: 8px 12px;
                 border-bottom: 1px solid var(--line); }
  .list .album:last-child { border-bottom: 0; }
  .list .album img, .list .album .noart {
    width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none;
  }
  .list .album strong, .list .album .muted { display: block; font-weight: 600; }
  .list .album .muted { font-weight: 400; }
  /* The sticker preview mirrors what the PDF does: a 46 mm circle, the cover
     either filling it or inset on a blurred copy of itself. */
  .preview {
    position: relative; width: 46px; height: 46px; border-radius: 50%;
    overflow: hidden; flex: none; background: var(--line);
    box-shadow: 0 0 0 1px var(--line);
  }
  .preview .bg, .preview .fg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
  }
  .preview .bg { display: none; }
  .preview.is-fit .bg { display: block; filter: blur(4px); transform: scale(1.3); }
  .preview.is-fit .fg { inset: 15%; }

  img.pick {
    width: 40px; height: 40px; object-fit: cover; border-radius: 6px;
    cursor: pointer; opacity: .45; border: 2px solid transparent;
  }
  img.pick.chosen { opacity: 1; border-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); }

  .onbox {
    font-weight: 600; font-size: 12px; margin-left: 8px; padding: 1px 7px;
    border-radius: 99px; background: var(--accent); color: var(--card);
    vertical-align: 1px;
  }
  a.album strong, a.album .muted { display: block; font-weight: 600; }
  a.album .muted { font-weight: 400; }

  /* A file input cannot be styled, so the label is the button. */
  label.button { display: inline-block; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f; --card: #211e18; --ink: #ece7dd; --muted: #a09889;
      --line: #35302a; --accent: #fb923c;
    }
    button.primary { color: #17150f; }
    input[type=text] { background: #17150f; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">tonie-studio</a>
  <a href="/">Alben</a>
  <a href="/tonies">Tonies</a>
  <a href="/sheet">Blatt</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
