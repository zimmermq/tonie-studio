{% extends "base.html" %}
{% block title %}{{ t("sheet.job_title") }} - tonie-studio{% endblock %}

{% block body %}
<h1>{{ t("sheet.job_title") }}</h1>

<div class="card">
  <div class="bar"><div id="fill" style="width: {{ job.percent or 0 }}%"></div></div>
  <p class="muted mb-0" id="detail">{{ t("sheet.job_waiting") }}</p>
</div>

<p class="warn" id="problem" hidden></p>
<p class="muted" id="skipped" hidden></p>
<p id="ready" hidden>
  <a class="button primary" id="download" href="/sheet/print/{{ job.id }}/pdf">{{ t("sheet.download") }}</a>
</p>
<p><a href="/sheet">{{ t("sheet.back_to_sheet") }}</a></p>

<script type="application/json" id="page-data">{{ {"id": job.id, "words": t.strings("sheet.job_waiting", "sheet.job_pictures", "sheet.job_pdf", "sheet.job_done", "sheet.skipped")} | tojson }}</script>
<script src="{{ asset('sheet_job.js') }}"></script>
{% endblock %}
