name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

# Read only: nothing here writes to this repository. The release job reaches
# Docker Hub and homelab-iac with secrets of their own, not with this token.
permissions:
  contents: read

# Actions are pinned by commit, not by tag: a tag can be moved to other code,
# which would then run next to DOCKER_PASSWORD and HOMELAB_PAT. Renovate keeps
# the commits current and the version comments next to them.
jobs:
  # Pinned rather than ubuntu-latest: setup-python needs a build of the exact
  # Python version for the runner image, and a freshly switched image may not
  # have one yet, which would fail a release for reasons outside this repo.
  # Move it on deliberately when a newer image has been tried.
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest tests/ -v --tb=short
          python scripts/check_chars.py
          echo "All tests passed"

      # The pages' scripts run only in a browser, which no test above starts;
      # this refuses a release whose JavaScript does not parse, and runs the
      # few page scripts that have tests of their own against a stand-in page.
      - name: Check the JavaScript parses and its page tests pass
        run: |
          for script in src/tonie_studio/static/*.js; do node --check "$script"; done
          for test in tests/js/*.test.mjs; do node "$test"; done

  # Validate the image builds on every push to main (no push to registry).
  build-validation:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image for validation
        run: |
          docker build -t tonie-studio:validation .
          echo "Build validation successful"

  # On a published release, build the image for amd64 and arm64 (a Raspberry
  # Pi runs teddyCloud as often as a server does), push it to Docker Hub, and
  # open a PR in homelab-iac pointing the deployment at it.
  build-and-deploy:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    env:
      IMAGE: docker.io/zimmermq/tonie-studio
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get release version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TS_VERSION=${{ steps.version.outputs.version }}
            TS_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update homelab-iac repository
        env:
          GITHUB_TOKEN: ${{ secrets.HOMELAB_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git clone https://x-access-token:$GITHUB_TOKEN@github.com/JonasHess/homelab-iac.git
          cd homelab-iac

          BRANCH_NAME="update-tonie-studio-$VERSION"
          git checkout -b $BRANCH_NAME

          git config user.name "tonie-studio-bot"
          git config user.email "noreply@github.com"

          # Pure-generic app: the image is inline in generic.deployment.image.
          # The whole reference is written, registry included, so a deployment
          # still pointing at an older registry moves along with the tag. The
          # digest pins the image just built: a tag on Docker Hub can be pushed
          # over, a digest cannot. The tag stays in front for a person reading it.
          test -n "$DIGEST"
          sed -i "s#image:[[:space:]]*.*tonie-studio:.*#image: $IMAGE:$VERSION@$DIGEST#" apps/tonie-studio/values.yaml

          # If the chart already pins this tag (e.g. the very first release), there
          # is nothing to change - succeed without opening an empty PR.
          if git diff --quiet apps/tonie-studio/values.yaml; then
            echo "homelab-iac already pins tonie-studio:$VERSION - no PR needed."
            exit 0
          fi

          git add apps/tonie-studio/values.yaml

          git commit -m "chore: Update tonie-studio to $VERSION

          Automated update from tonie-studio release
          - Image: $IMAGE:$VERSION@$DIGEST"

          git push origin $BRANCH_NAME

          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/JonasHess/homelab-iac/pulls \
            -d "{
              \"title\": \"Update tonie-studio to $VERSION\",
              \"head\": \"$BRANCH_NAME\",
              \"base\": \"main\",
              \"body\": \"Automated update of the tonie-studio container image to $VERSION.\\n\\n- Updated apps/tonie-studio/values.yaml image tag\\n- Image: $IMAGE:$VERSION@$DIGEST\"
            }"
