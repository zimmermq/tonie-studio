name: End-to-end check against teddyCloud

# Runs the app against a real teddyCloud in Docker (scripts/e2e_teddycloud.py)
# and checks what it really wrote there: the unit tests talk to a stand-in,
# which can behave differently from the real server. Too slow for every push,
# so it runs when started by hand and once a week when main has moved since
# the last successful run.
on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'Modes to run: normal, slow (uploads in pieces, as over a network), or both'
        required: false
        default: 'normal,slow'
  schedule:
    # Mondays early, before anyone releases; GitHub's clock is UTC.
    - cron: '0 3 * * 1'

# Read only: the run reads this repository and asks GitHub about its own
# earlier runs, nothing else.
permissions:
  contents: read
  actions: read

# Actions are pinned by commit, as in docker-build-deploy.yml.
jobs:
  e2e:
    runs-on: ubuntu-26.04
    # The first run also makes teddyCloud's certificates (see below).
    timeout-minutes: 60
    steps:
      # A weekly run of code already checked would only cost time.
      - name: Anything new since the last successful run?
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "${{ github.repository }}" --workflow e2e.yml \
                 --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main is still at $last, checked already."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.due.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'

      - name: Install dependencies and ffmpeg
        if: steps.due.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # A fresh teddyCloud spends a quarter of an hour making its own RSA
      # certificates on first start; kept between runs, it answers at once.
      - name: Keep teddyCloud's certificates between runs
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e-certs
          key: e2e-teddycloud-certs-0.7.0

      - name: Run the end-to-end check
        if: steps.due.outputs.run == 'true'
        env:
          MODES: ${{ github.event.inputs.modes || 'normal,slow' }}
        run: |
          PYTHONPATH=src python scripts/e2e_teddycloud.py --work "$RUNNER_TEMP/e2e" \
            --certs "$RUNNER_TEMP/e2e-certs" --modes "$MODES"

      # The logs of teddyCloud and the app, for whoever looks into a failure.
      - name: Keep the logs
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/**/*.log
            ${{ runner.temp }}/e2e/**/*.txt
          if-no-files-found: ignore
          retention-days: 14
